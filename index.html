<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#000000">

  <title>Kaavya & Yash AR</title>

  <link rel="stylesheet" href="/src/style.css">
</head>

<body>

  <!-- =========================================
       AR CAMERA CONTAINER
  ========================================== -->

  <div id="ar"></div>


  <!-- =========================================
       UI LAYER
  ========================================== -->

  <div id="ui">

    <!-- UPPER PANEL -->
    <img
      id="upper-panel"
      class="panel upper-panel"
      src="/panel.png"
      alt=""
    >

    <!-- LOWER PANEL -->
    <img
      id="lower-panel"
      class="panel lower-panel"
      src="/panel.png"
      alt=""
    >


    <!-- =======================================
         ENTER BUTTON
    ======================================== -->

    <img
      id="enter-btn"
      class="ui-button enter-button"
      src="/Benter.png"
      alt="Enter"
    >


    <!-- =======================================
         START QR BUTTON
    ======================================== -->

    <img
      id="start-ar-btn"
      class="ui-button start-button hidden"
      src="/Bstartqr.png"
      alt="Start AR"
    >


    <!-- =======================================
         AR SCREEN GRAPHICS
    ======================================== -->

    <img
      id="ar-arrow"
      class="ar-element arrow hidden"
      src="/arrow.png"
      alt=""
    >

    <img
      id="yash"
      class="ar-element yash hidden"
      src="/YASH.png"
      alt="Yash"
    >

    <img
      id="designation"
      class="ar-element designation hidden"
      src="/Technical Secretary.png"
      alt="Technical Secretary"
    >

  </div>


  <!-- =========================================
       JAVASCRIPT
  ========================================== -->

  <script type="module" src="/src/main.js"></script>

</body>

</html>
